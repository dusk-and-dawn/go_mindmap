<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mindmap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a2e;
            color: #eee;
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }

        #toolbar h1 { font-size: 1rem; font-weight: 600; margin-right: auto; }

        button {
            padding: 6px 14px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #0f3460;
            color: #eee;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button:hover { background: #1a4a8a; }

        #status {
            font-size: 0.8rem;
            color: #aaa;
            min-width: 280px;
        }

        #cy {
            flex: 1;
        }

        /* Note bar at the bottom */
        #note {
            font-size: 0.75rem;
            color: #666;
            padding: 4px 16px;
            background: #16213e;
            border-top: 1px solid #0f3460;
        }
        .panel {
        padding: 0 18px;
        background-color: #16213e;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.2s ease-out;
}
    </style>
</head>
<body>
    <button class="accordion">Mindmap 1</button>
        <div class="panel">
        <p>Testmindmap mit Test-Nodes</p>
        <a href="mindmap.html?id=01">Öffnen</a>
        </div>

    <button class="accordion">Mindmap 2</button>
        <div class="panel">
        <p>Lorem ipsum...</p>
        </div>

    <button class="accordion">Mindmap 3</button>
        <div class="panel">
        <p>Lorem ipsum...</p>
        </div>
</body>
<script>
var acc = document.getElementsByClassName("accordion");
var i;

for (i = 0; i < acc.length; i++) {
  acc[i].addEventListener("click", function() {
    this.classList.toggle("active");
    var panel = this.nextElementSibling;
    if (panel.style.maxHeight) {
      panel.style.maxHeight = null;
    } else {
      panel.style.maxHeight = panel.scrollHeight + "px";
    }
  });
}
</script>
